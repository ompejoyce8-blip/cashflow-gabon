<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CASHFLOW – Gérez votre argent simplement</title>
<meta name="description" content="CASHFLOW : suivez vos revenus et vos dépenses en FCFA, gratuitement, sur téléphone et ordinateur.">
<meta name="theme-color" content="#0f8a4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CASHFLOW">
<meta property="og:title" content="CASHFLOW – Gérez votre argent simplement">
<meta property="og:description" content="Revenus, dépenses et solde en FCFA. 100 % gratuit.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230f8a4b'/%3E%3Ctext x='32' y='44' font-size='36' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3EC%3C/text%3E%3C/svg%3E">
<style>
:root{--g:#0f8a4b;--g2:#0a6b3a;--gl:#e6f5ec;--bg:#f3faf6;--card:#fff;--tx:#10261a;--mut:#5b7266;--bd:#dcebe2;--red:#d64545;--redl:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gl:#143323;--bg:#0b1810;--card:#12251a;--tx:#e8f5ec;--mut:#9bb5a5;--bd:#23402d;--redl:#3a1c1c}}
:root[data-theme="dark"]{--gl:#143323;--bg:#0b1810;--card:#12251a;--tx:#e8f5ec;--mut:#9bb5a5;--bd:#23402d;--redl:#3a1c1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;padding-bottom:84px}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px;font-size:20px;color:var(--g)}
.lg{width:36px;height:36px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:18px}
.btn{border:0;border-radius:14px;padding:14px 20px;font-weight:700;cursor:pointer;font-size:16px;background:var(--g);color:#fff;width:100%}
.btn:hover{background:var(--g2)}
.btn.alt{background:var(--card);color:var(--g);border:2px solid var(--g)}
.btn.red{background:var(--red)}
.btn.sm{width:auto;padding:8px 14px;font-size:14px}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center;background:linear-gradient(160deg,var(--gl),var(--bg) 60%)}
.hero .logo{justify-content:center;font-size:28px}
.hero h1{font-size:clamp(28px,6vw,44px);margin:0;line-height:1.15}
.hero p{color:var(--mut);max-width:480px;margin:0 auto;font-size:17px}
.cta{display:grid;gap:12px;max-width:340px;margin:8px auto 0;width:100%}
.feats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:6px 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(15,138,75,.06)}
h2{margin:0 0 12px;font-size:20px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card)}
input:focus,select:focus{outline:2px solid var(--g);border-color:var(--g)}
.err{background:var(--redl);color:var(--red);padding:10px 12px;border-radius:10px;margin-top:12px;font-size:14px}
.link{background:none;border:0;color:var(--g);font-weight:700;cursor:pointer;padding:6px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.bal{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border:0}
.bal small{opacity:.85}.bal .big{font-size:clamp(28px,8vw,40px);font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.grid .card{margin:0}.grid small{color:var(--mut)}.grid b{display:block;font-size:17px;margin-top:4px;word-break:break-word}
.in{color:var(--g)}.out{color:var(--red)}
.acts{display:grid;gap:10px;margin-bottom:14px}
@media(min-width:560px){.acts{grid-template-columns:1fr 1fr}}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.ic{width:42px;height:42px;border-radius:12px;background:var(--gl);display:grid;place-items:center;font-size:20px;flex:none}
.rm{flex:1;min-width:0}.rm small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.am{font-weight:700;white-space:nowrap;font-size:14px}
.ib{background:none;border:0;font-size:18px;cursor:pointer;padding:6px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border-radius:99px;border:1.5px solid var(--bd);background:var(--card);cursor:pointer;font-weight:600}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav button{flex:1;max-width:200px;background:none;border:0;padding:10px 4px;cursor:pointer;color:var(--mut);font-size:12px;font-weight:600}
.nav button span{display:block;font-size:22px}
.nav button.on{color:var(--g)}
.bar{margin:10px 0}.bar .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar .t{height:12px;background:var(--gl);border-radius:99px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--g);border-radius:99px}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:8px}
.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut)}
.cols i{display:block;width:100%;background:var(--g);border-radius:8px 8px 0 0;min-height:2px}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.mod>div{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px;max-height:92vh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:560px){.mod{align-items:center}.mod>div{border-radius:24px}}
.empty{text-align:center;color:var(--mut);padding:20px}
.note{font-size:12px;color:var(--mut);text-align:center;margin:16px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
const CATS={"Transport":"🚌","Nourriture":"🍲","Logement":"🏠","Santé":"💊","Internet":"📶","Études":"🎓","Loisirs":"🎮","Autres":"📦"};
const INC={"Salaire":"💼","Revenus commerciaux":"🛍️","Autres revenus":"💰"};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>new Intl.NumberFormat("fr-FR").format(Math.round(n)).replace(/[\u202f\u00a0]/g," ")+" FCFA";
const mem={};
const ls={get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):(mem[k]??null)}catch(e){return mem[k]??null}},
set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now()+""+Math.random());
function dstr(off){const d=new Date();d.setDate(d.getDate()+(off||0));return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
const fdate=s=>s.split("-").reverse().join("/");
async function hash(pw,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:150000,hash:"SHA-256"},k,256);
return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

let S={view:"home",mode:"login",tab:"dash",user:null,tx:[],filter:"all",err:""};

function init(){const id=ls.get("cf_session");const u=(ls.get("cf_users")||[]).find(x=>x.id===id);
if(u){S.user=u;S.tx=ls.get("cf_tx_"+u.id)||[];S.view="app"}render()}
function go(v,m){S.view=v;if(m)S.mode=m;S.err="";render();window.scrollTo(0,0)}
function save(){ls.set("cf_tx_"+S.user.id,S.tx)}
function tot(){let i=0,o=0;S.tx.forEach(t=>t.type==="in"?i+=t.amount:o+=t.amount);return{i,o,s:i-o}}

function render(){const a=$("#app");a.innerHTML=S.view==="home"?home():S.view==="auth"?authV():appV()}

function home(){return `<div class="wrap hero">
<div class="logo"><span class="lg">C</span>CASHFLOW</div>
<h1>Gérez votre argent,<br>simplement.</h1>
<p>Notez vos revenus et vos dépenses en FCFA, suivez votre solde en direct et comprenez où va votre argent. Gratuit, sans abonnement.</p>
<div class="feats"><span class="chip">💸 Dépenses</span><span class="chip">💼 Revenus</span><span class="chip">📊 Statistiques</span><span class="chip">🔒 Privé</span></div>
<div class="cta"><button class="btn" onclick="go('auth','register')">Commencer gratuitement</button>
<button class="btn alt" onclick="go('auth','login')">Se connecter</button></div>
<div class="note">100 % gratuit · Aucun paiement · Fonctionne sur téléphone et ordinateur</div></div>`}

function authV(){const r=S.mode==="register";return `<div class="wrap" style="max-width:440px;padding-top:30px">
<button class="link" onclick="go('home')">← Retour</button>
<div class="logo" style="margin:10px 0 18px"><span class="lg">C</span>CASHFLOW</div>
<div class="card"><h2>${r?"Créer mon compte":"Se connecter"}</h2>
<form onsubmit="auth(event)">
${r?`<label>Votre prénom</label><input id="nm" required maxlength="40" autocomplete="given-name">`:""}
<label>Adresse e-mail</label><input id="em" type="email" required autocomplete="email">
<label>Mot de passe ${r?"(6 caractères minimum)":""}</label><input id="pw" type="password" required minlength="6" autocomplete="${r?"new-password":"current-password"}">
${S.err?`<div class="err">${esc(S.err)}</div>`:""}
<button class="btn" style="margin-top:18px">${r?"Créer mon compte":"Me connecter"}</button></form>
<div style="text-align:center;margin-top:10px"><button class="link" onclick="go('auth','${r?"login":"register"}')">${r?"J’ai déjà un compte":"Pas encore de compte ? S’inscrire"}</button></div></div></div>`}

async function auth(e){e.preventDefault();const em=$("#em").value.trim().toLowerCase(),pw=$("#pw").value;
let users=ls.get("cf_users")||[];
try{if(S.mode==="register"){if(users.some(u=>u.email===em))return fail("Cet e-mail est déjà utilisé.");
const salt=uid();const u={id:uid(),name:$("#nm").value.trim(),email:em,salt,hash:await hash(pw,salt)};
users.push(u);ls.set("cf_users",users);login(u)}
else{const u=users.find(x=>x.email===em);if(!u||u.hash!==await hash(pw,u.salt))return fail("E-mail ou mot de passe incorrect.");login(u)}}
catch(x){fail("Une erreur est survenue. Utilisez un lien sécurisé (https).")}}
function fail(m){S.err=m;const keep=[$("#nm"),$("#em")].map(x=>x&&x.value);render();if($("#nm"))$("#nm").value=keep[0]||"";$("#em").value=keep[1]||""}
function login(u){ls.set("cf_session",u.id);S.user=u;S.tx=ls.get("cf_tx_"+u.id)||[];S.tab="dash";go("app")}
function logout(){ls.del("cf_session");S.user=null;S.tx=[];go("home")}

function row(t,act){const ic=t.type==="in"?INC[t.cat]:CATS[t.cat];
return `<div class="row"><div class="ic">${ic||"💰"}</div><div class="rm"><b>${esc(t.cat)}</b><small>${fdate(t.date)}${t.desc?" · "+esc(t.desc):""}</small></div>
<div class="am ${t.type}">${t.type==="in"?"+":"−"}${fmt(t.amount)}</div>
${act?`<button class="ib" title="Modifier" onclick="openForm('${t.type}','${t.id}')">✏️</button><button class="ib" title="Supprimer" onclick="del('${t.id}')">🗑️</button>`:""}</div>`}
const sorted=()=>[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));

function appV(){let c="";
if(S.tab==="dash"){const T=tot(),rate=T.i>0?Math.max(0,Math.round(T.s/T.i*100)):0,rec=sorted().slice(0,5);
c=`<div class="card bal"><small>Solde disponible</small><div class="big">${fmt(T.s)}</div><small>Revenus − Dépenses</small></div>
<div class="grid"><div class="card"><small>💼 Revenus</small><b class="in">${fmt(T.i)}</b></div>
<div class="card"><small>💸 Dépenses</small><b class="out">${fmt(T.o)}</b></div>
<div class="card" style="grid-column:1/-1"><small>🐷 Épargne estimée</small><b>${fmt(Math.max(0,T.s))} <span style="font-weight:400;color:var(--mut)">(${rate} % de vos revenus)</span></b></div></div>
<div class="acts"><button class="btn red" onclick="openForm('out')">➖ Ajouter une dépense</button><button class="btn" onclick="openForm('in')">➕ Ajouter un revenu</button></div>
<div class="card"><h2>Dernières opérations</h2>${rec.length?rec.map(t=>row(t)).join(""):'<div class="empty">Aucune opération pour le moment.<br>Ajoutez votre première dépense ou votre premier revenu !</div>'}</div>`}
else if(S.tab==="hist"){const l=sorted().filter(t=>S.filter==="all"||t.type===S.filter);
c=`<div class="card"><h2>Historique</h2><div class="tabs">${[["all","Tout"],["in","Revenus"],["out","Dépenses"]].map(([k,n])=>`<button class="${S.filter===k?"on":""}" onclick="S.filter='${k}';render()">${n}</button>`).join("")}</div>
${l.length?l.map(t=>row(t,1)).join(""):'<div class="empty">Rien à afficher ici.</div>'}</div>`}
else c=stats();
return `<div class="wrap"><div class="top"><div class="logo"><span class="lg">C</span>CASHFLOW</div><button class="btn alt sm" onclick="logout()">Déconnexion</button></div>
<p style="margin:0 0 12px;color:var(--mut)">Bonjour <b style="color:var(--tx)">${esc(S.user.name)}</b> 👋</p>${c}
<div class="note">🔒 Vos données sont enregistrées uniquement sur cet appareil.</div></div>
<div class="nav">${[["dash","🏠","Accueil"],["hist","🧾","Historique"],["stats","📊","Statistiques"]].map(([k,i,n])=>`<button class="${S.tab===k?"on":""}" onclick="S.tab='${k}';render();scrollTo(0,0)"><span>${i}</span>${n}</button>`).join("")}</div>`}

function bars(items,fmtv){const m=Math.max(1,...items.map(x=>x[1]));
return `<div class="cols">${items.map(([l,v])=>`<div><span style="margin-bottom:3px">${v?fmtv(v):""}</span><i style="height:${Math.max(2,v/m*100*.78)}%"></i><span style="margin-top:4px">${l}</span></div>`).join("")}</div>`}
function stats(){const out=S.tx.filter(t=>t.type==="out"),ym=dstr().slice(0,7),mo=out.filter(t=>t.date.startsWith(ym));
const byc={};mo.forEach(t=>byc[t.cat]=(byc[t.cat]||0)+t.amount);const cl=Object.entries(byc).sort((a,b)=>b[1]-a[1]),cm=cl.length?cl[0][1]:1,mt=mo.reduce((s,t)=>s+t.amount,0);
const days=[];for(let i=6;i>=0;i--){const d=dstr(-i),dt=new Date(d+"T12:00:00");days.push([dt.toLocaleDateString("fr-FR",{weekday:"short"}).slice(0,3),out.filter(t=>t.date===d).reduce((s,t)=>s+t.amount,0)])}
const wk=[0,0,0,0,0];mo.forEach(t=>wk[Math.min(4,Math.ceil(+t.date.slice(8)/7)-1)]+=t.amount);
const k=v=>v>=1000?Math.round(v/1000)+"k":v;
return `<div class="card"><h2>Dépenses par catégorie</h2><small style="color:var(--mut)">Ce mois-ci</small>
${cl.length?cl.map(([c,v])=>`<div class="bar"><div class="l"><span>${CATS[c]||""} ${esc(c)}</span><b>${fmt(v)}</b></div><div class="t"><i style="width:${v/cm*100}%"></i></div></div>`).join(""):'<div class="empty">Aucune dépense ce mois-ci.</div>'}</div>
<div class="card"><h2>Dépenses de la semaine</h2><small style="color:var(--mut)">7 derniers jours · total ${fmt(days.reduce((s,x)=>s+x[1],0))} · en milliers de FCFA (k)</small>${bars(days,k)}</div>
<div class="card"><h2>Dépenses du mois</h2><small style="color:var(--mut)">Total ${fmt(mt)} · par semaine du mois</small>${bars(wk.map((v,i)=>["S"+(i+1),v]),k)}</div>`}

function openForm(type,id){const t=id?S.tx.find(x=>x.id===id):null,cats=type==="in"?INC:CATS;
$("#modal").innerHTML=`<div class="mod" onclick="if(event.target===this)closeForm()"><div>
<h2>${t?"Modifier":type==="in"?"Ajouter un revenu":"Ajouter une dépense"}</h2>
<form onsubmit="saveTx(event,'${type}','${id||""}')">
<label>Montant (FCFA)</label><input id="f_a" type="number" inputmode="numeric" min="1" step="1" required value="${t?t.amount:""}" placeholder="Ex : 15000">
<label>${type==="in"?"Type de revenu":"Catégorie"}</label><select id="f_c">${Object.keys(cats).map(c=>`<option ${t&&t.cat===c?"selected":""}>${c}</option>`).join("")}</select>
<label>Date</label><input id="f_d" type="date" required value="${t?t.date:dstr()}">
<label>Description (facultatif)</label><input id="f_t" maxlength="80" value="${t?esc(t.desc):""}" placeholder="Ex : Taxi pour le travail">
<div style="display:grid;gap:10px;margin-top:18px"><button class="btn ${type==="out"?"red":""}">Enregistrer</button><button type="button" class="btn alt" onclick="closeForm()">Annuler</button></div></form></div></div>`;
setTimeout(()=>$("#f_a").focus(),50)}
function closeForm(){$("#modal").innerHTML=""}
function saveTx(e,type,id){e.preventDefault();const a=Math.round(+$("#f_a").value);if(!(a>0))return;
const o={type,amount:a,cat:$("#f_c").value,date:$("#f_d").value,desc:$("#f_t").value.trim()};
if(id){Object.assign(S.tx.find(x=>x.id===id),o)}else S.tx.push({id:uid(),...o});
save();closeForm();render()}
function del(id){if(confirm("Supprimer cette opération ?")){S.tx=S.tx.filter(x=>x.id!==id);save();render()}}
init();
</script>
</body>
</html>
